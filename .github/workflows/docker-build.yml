name: Docker build (GHA layer cache)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # creates a docker-container driver builder (required for --cache-to;
      # the default `docker` driver cannot export cache to GHA)
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: demo:latest
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name demo demo:latest
          sleep 1
          docker ps -a --filter name=demo --format '{{.Status}}'
          docker logs demo
          curl --retry 5 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8000
          docker rm -f demo
